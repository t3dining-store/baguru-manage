<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script>
  /* バグる Owner の中から開いたとき（?from=owner）だけ、viewport-fit=cover を外す（2026-11-01。予約ボードと同じ）。
     iPhone のホーム画面のアプリで別のページへ移ると、cover のままでは、使える高さが時計の帯のぶん短いのに上の端が時計の下にもぐり、
     下にすき間ができて全体が上に寄る。ホーム画面から直接開くときは、今までのまま。くわしくは バグる Owner の README */
  (function () {
    var owner = /[?&]from=owner\b/.test(location.search);
    try { owner = owner || sessionStorage.getItem('bg.fromOwner') === '1'; } catch (e) {}
    if (!owner) return;
    var v = document.querySelector('meta[name="viewport"]');
    v.setAttribute('content', v.getAttribute('content').replace(/,\s*viewport-fit=cover/, ''));
    addEventListener('pageshow', function (e) { if (!e.persisted) scrollTo(0, 0); });   // 切り替えたときのずれが残らないように
  })();
</script>
<meta name="robots" content="noindex, nofollow">   <!-- 管理の画面なので、検索に出さない -->
<meta name="theme-color" content="#1f1916">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="バグるマネージ">
<title>バグるマネージ</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="img/manage-icon-192.png">
<link rel="apple-touch-icon" href="img/manage-icon-180.png">
<!-- 字の形は公式アプリ・ホームページと同じ。読めないときは、スマホの字で出る -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/manage.css?v=912fa4b0">
</head>
<body>
<header class="m-top">
  <button id="homeBtn" class="m-home" hidden>🏠 ホーム</button>   <!-- バグる Owner から開いたときだけ（manage.js） -->
  <h1><img src="img/manage-icon-192.png" alt=""><span>バグるマネージ</span></h1>
  <button id="saveBtn" class="m-save" hidden disabled>保存</button>
</header>

<script src="js/manage.js?v=657d8c2d"></script>
</body>
</html>
